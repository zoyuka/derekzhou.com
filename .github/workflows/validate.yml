name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=(
            index.html
            style.v2.css
            site.js
            pachinko.js
            robots.txt
            _headers
            _redirects
            404.html
            assets/favicon.png
            assets/favicon.svg
            assets/apple-touch-icon.png
            assets/fonts/Newsreader-Regular.sub1.woff2
            assets/fonts/Newsreader-Bold.sub1.woff2
            assets/fonts/DMSans-Regular.sub1.woff2
            assets/fonts/DMSans-Medium.sub1.woff2
            .well-known/security.txt
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: No secrets in code
        run: |
          # Scan for common secret patterns in tracked files
          patterns=(
            'AKIA[0-9A-Z]{16}'
            'sk-[a-zA-Z0-9]{20,}'
            'ghp_[a-zA-Z0-9]{36}'
            'password\s*[:=]\s*["\x27][^"\x27]{8,}'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if grep -rEn "$pattern" --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' --include='*.txt' . 2>/dev/null | grep -v node_modules; then
              echo "POTENTIAL SECRET found matching: $pattern"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Potential secrets detected in source files"
            exit 1
          fi
          echo "No secrets found"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          node --test "sysco/engine/*.test.js"
          # Auth/SSRF guards for the live search API — a regression here turns the
          # menu endpoint into an open proxy.
          node --test "functions/api/lib/*.test.js"
          node --test "functions/api/search.test.js"

      - name: API routes must be wired
        run: |
          if [ -d functions/api ] && ! grep -q '"/api/\*"' _routes.json; then
            echo "::error::functions/api exists but _routes.json does not route /api/*"
            exit 1
          fi
          echo "API routing OK"

      - name: No inline code on CSP'd pages
        run: |
          # The site-wide CSP has no unsafe-inline; inline styles, style
          # blocks, and inline event handlers silently do nothing. Fail
          # fast instead. (JSON-LD script blocks are exempt from
          # script-src and allowed.)
          if grep -niE 'style[[:space:]]*=[[:space:]]*"|<style|[[:space:]]on[a-z]+[[:space:]]*=[[:space:]]*"' index.html 404.html; then
            echo "::error::Inline style/handler found — blocked by CSP"
            exit 1
          fi
          echo "No inline code"

      - name: Validate HTML
        run: |
          # Basic HTML validity checks
          file="index.html"

          # Must start with doctype
          if ! head -1 "$file" | grep -qi '<!doctype html>'; then
            echo "::error::Missing <!DOCTYPE html>"
            exit 1
          fi

          # Check required tags exist
          for tag in '<html' '<head' '</head>' '<body' '</body>' '</html>'; do
            if ! grep -qi "$tag" "$file"; then
              echo "::error::Missing $tag in $file"
              exit 1
            fi
          done

          # Check charset meta
          if ! grep -qi 'charset.*utf-8' "$file"; then
            echo "::error::Missing charset utf-8 meta tag"
            exit 1
          fi

          # Check viewport meta
          if ! grep -qi 'viewport' "$file"; then
            echo "::error::Missing viewport meta tag"
            exit 1
          fi

          # Check title
          if ! grep -qi '<title>' "$file"; then
            echo "::error::Missing <title> tag"
            exit 1
          fi

          # Check for unclosed tags (basic)
          # The open pattern requires a delimiter after the tag name so that
          # <head> is not also matched by <header>, <main> by <mainbar>, etc.
          for tag in html head body main; do
            opens=$(grep -oiE "<$tag([[:space:]>]|$)" "$file" | wc -l)
            closes=$(grep -oi "</$tag>" "$file" | wc -l)
            if [ "$opens" -ne "$closes" ]; then
              echo "::error::Mismatched <$tag> tags (open=$opens, close=$closes)"
              exit 1
            fi
          done

          echo "HTML validation passed"
